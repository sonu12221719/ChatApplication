<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Application</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    <script defer src="http://localhost:8000/socket.io/socket.io.js"></script>
    <script defer src="js/client.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #f5f6fa;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .chat-header {
            padding: 24px;
            background: #f1f2f6;
            border-bottom: 1px solid #dcdde1;
            font-size: 1.2rem;
            font-weight: 500;
        }
        .messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 60%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.5;
            position: relative;
            word-break: break-word;
        }
        .message.sent {
            align-self: flex-end;
            background: #4cd137;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.received {
            align-self: flex-start;
            background: #f1f2f6;
            color: #222;
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            display: flex;
            padding: 16px 24px;
            background: #f1f2f6;
            border-top: 1px solid #dcdde1;
        }
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 24px;
            font-size: 1rem;
            outline: none;
            background: #fff;
            margin-right: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .send-btn {
            background: #40739e;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 0 24px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background: #273c75;
        }
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 200px;
                flex-direction: row;
                overflow-x: auto;
            }
            .contacts {
                flex-direction: row;
                display: flex;
            }
            .contact {
                flex-direction: column;
                align-items: center;
                padding: 12px;
            }
            .chat-area {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <main class="chat-area">
            <div class="chat-header"></div>
            <div class="messages" id="messages">
            </div>
            <form class="chat-input-area" id="chat-form" autocomplete="off">
                <input class="chat-input" id="chat-input" type="text" placeholder="Type a message..." required />
                <button class="send-btn" type="submit">Send</button>
            </form>
        </main>
    </div>
    
</body>
</html>
